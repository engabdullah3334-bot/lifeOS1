<!-- Login Screen - shown when user is not authenticated -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 14.6 9.4 22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6z"/></svg></div>
      <h1 class="login-title">Life OS</h1>
      <p class="login-subtitle">Welcome back — your Life Operating System.<br>Focus. Create. Achieve.</p>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="login-form" novalidate>
      <div class="login-field">
        <label for="login-identifier">Email or Username</label>
        <input type="text" id="login-identifier" name="identifier" placeholder="email@example.com or username" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="login-password">Password</label>
        <div class="login-pw">
          <input type="password" id="login-password" name="password" placeholder="Enter password" autocomplete="current-password" required>
          <button type="button" class="login-pw-toggle" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div class="login-options">
        <label class="login-remember">
          <input type="checkbox" id="login-remember" name="remember">
          <span>Remember Me</span>
        </label>
      </div>
      <p id="login-error" class="login-error" role="alert"></p>
      <button type="submit" class="login-btn" id="login-submit">Login</button>
      <p class="login-hint">Don't have an account? <a href="#" id="show-signup">Create one</a></p>
    </form>

    <!-- Signup Form (hidden by default) -->
    <form id="signup-form" class="login-form" novalidate style="display:none;">
      <div class="login-field">
        <label for="signup-username">Username</label>
        <input type="text" id="signup-username" name="username" placeholder="username" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="signup-email">Email Address</label>
        <input type="email" id="signup-email" name="email" placeholder="email@example.com" autocomplete="email" required>
      </div>
      <div class="login-field">
        <label for="signup-password">Password (min 6 characters)</label>
        <div class="login-pw">
          <input type="password" id="signup-password" name="password" placeholder="••••••" autocomplete="new-password" required minlength="6">
          <button type="button" class="login-pw-toggle" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <p id="signup-error" class="login-error" role="alert"></p>
      <button type="submit" class="login-btn" id="signup-submit">Sign Up</button>
      <p class="login-hint">Already have an account? <a href="#" id="show-login">Login here</a></p>
    </form>
  </div>
</div>
